name: Arc CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm install
          cd compiler && npm install
      - name: Build compiler
        run: cd compiler && npm run build
      - name: Run tests
        run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install
          cd compiler && npm install
      - run: cd compiler && npm run build
      - name: Lint examples
        run: |
          for f in examples/*.arc; do
            node compiler/dist/index.js lint "$f" || true
          done

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install
          cd compiler && npm install && npm run build
      - name: Smoke test
        run: |
          echo 'print("Hello from Arc!")' > /tmp/hello.arc
          node compiler/dist/index.js run /tmp/hello.arc
          node compiler/dist/index.js builtins
          node compiler/dist/index.js --version

  publish:
    needs: [test, lint, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: cd compiler && npm install
      - run: cd compiler && npm run build
      - run: cd compiler && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
